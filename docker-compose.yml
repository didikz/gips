services:
  gips:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: info
      REDIS_ADDR: redis:6379
    volumes:
      - ./data:/data
    depends_on:
      - redis
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
